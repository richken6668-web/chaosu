<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 背景：圆角矩形，带品牌感 -->
  <rect width="32" height="32" rx="6" fill="#4F46E5"/>
  
  <!-- 原型线框：模拟页面布局 -->
  <rect x="6" y="6" width="20" height="20" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/>
  <line x1="6" y1="12" x2="26" y2="12" stroke="#fff" stroke-width="1.5"/>
  <rect x="9" y="15" width="8" height="8" rx="1" fill="#fff" opacity="0.6"/>
  <rect x="19" y="15" width="4" height="3" rx="0.5" fill="#fff" opacity="0.6"/>
  <rect x="19" y="20" width="4" height="3" rx="0.5" fill="#fff" opacity="0.6"/>
  
  <!-- 交互光标：点睛之笔，暗示"可交互/预览" -->
  <polygon points="22,22 22,28 24.5,26 27,29 28.5,27.5 26,25 28.5,24.5" fill="#FBBF24"/>
</svg>